{% extends "layout.html" %}

{% block title %}Registrarse{% endblock %}

{% block main %}
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h2 class="text-center mb-4">Bienvenido</h2>
            <form action="{{ url_for('register') }}" method="post" class="card p-4 shadow">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" min="8" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Confirma tu contraseña</label>
                    <input type="password" name="confirm" class="form-control" min="8" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Registrarme</button>
            </form>
        </div>
    </div>
{% endblock %}
