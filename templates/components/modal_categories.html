<form action="/" method="POST" id="categories-form" class="dashboard-form">
  <input type="hidden" name="categories_type" value="income" id="categoriesType">
  <input type="hidden" name="added_categories" value="[]" id="addedCategories">
  <input type="hidden" name="deleted_categories" value="[]" id="deletedCategories">

  <span class="config-categories-info">Una vez que se haga click en el botón de "Aceptar" se actualizaran los datos, si no estas seguro(a) puedes hacer click en el botón de "Cancelar"</span>

  <div class="form-group">
    <label for="new_category_input" id="add-category-label">Agregar Nueva Categoria de Ingreso</label>
    <div class="new_category_actions">
      <input type="text" name="new_category" id="new_category_input" placeholder="Ej: Alquileres, Comisiones, etc.">
      <button type="button" id="addNewCategoryBtn" class="btn-add-cat">&plus;</button>
    </div>
  </div>

  <div class="form-group">
    <label id="delete-category-label">Categorias de Ingresos</label>
    <ul class="category-form-list">
      <li class="category-form-item income-category">
        <span class="category-form-name">Salario</span>
        <button type="button" class="delete-category-btn" data-category-id="1">&times;</button>
      </li>

      <li class="category-form-item income-category">
        <span class="category-form-name">Bonus</span>
        <button type="button" class="delete-category-btn" data-category-id="2">&times;</button>
      </li>

      <li class="category-form-item expense-category">
        <span class="category-form-name">Comida</span>
        <button type="button" class="delete-category-btn" data-category-id="3">&times;</button>
      </li>

      <li class="category-form-item expense-category">
        <span class="category-form-name">Bonus</span>
        <button type="button" class="delete-category-btn" data-category-id="4">&times;</button>
      </li>
    </ul>
  </div>
</form>
