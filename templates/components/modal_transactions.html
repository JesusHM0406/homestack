<form action="{{ url_for('add_transaction') }}" method="POST" id="transaction-form">
  <input type="hidden" name="transaction_type" value="income" id="transaction_type">

  <div class="form-group">
      <label>Tipo de Transacción</label>
      <div class="toggle-container">
        <button type="button" class="btn-toggle active" data-type="gasto" id="toggleTransactionExpense">Gasto</button>
        <button type="button" class="btn-toggle" data-type="ingreso" id="toggleTransactionIncome">Ingreso</button>
      </div>
  </div>

  <div class="form-group">
    <label for="descripcion">Descripción</label>
    <input type="text" name="description" placeholder="Ej: Supermercado, Salario, etc." required>
  </div>

  <div class="form-group">
    <label for="amount">Monto</label>
    <input type="number" name="amount" placeholder="0.00" step="0.50" min="0.50" required>
  </div>

  <div class="form-group">
    <label for="category">Categoria</label>
    <select name="category" id="category-select" required>
      <option value="" disabled selected hidden>Selecciona una categoria</option>
      <option value="Comida" class="opt-expense">Comida</option>
      <option value="Escuela" class="opt-expense">Escuela</option>
      <option value="Comida" class="opt-income">Salario</option>
      <option value="Escuela" class="opt-income">Extra</option>
    </select>
  </div>

  <div class="form-actions">
    <button type="button" id="cancelBtn">Cancelar</button>
    <button type="submit" id="submitTransaction">Agregar movimiento</button>
  </div>
</form>
